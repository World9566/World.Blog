name: ${COMPOSE_PROJECT_NAME:-world-blog}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  SITE_URL: ${SITE_URL:?Set SITE_URL in .env.production}
  BETTER_AUTH_URL: ${SITE_URL:?Set SITE_URL in .env.production}
  DATABASE_URL: postgresql://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blog}
  MEILI_HOST: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET}
  TRUST_PROXY: "1"
  APP_REVISION: ${BLOG_RELEASE:?Set BLOG_RELEASE}

services:
  web:
    image: ${BLOG_IMAGE:?Set BLOG_IMAGE}:${BLOG_RELEASE:?Set BLOG_RELEASE}
    restart: unless-stopped
    init: true
    environment: *app-environment
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 6
    logging: *logging

  gateway:
    image: ${GATEWAY_IMAGE:-nginx:1.28.2-alpine}
    user: "101:101"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: []
    command:
      [
        "/bin/sh",
        "-c",
        "envsubst '$$SITE_HOST' < /etc/nginx/blog.conf.template > /tmp/blog.conf && exec nginx -c /tmp/blog.conf -g 'daemon off;'",
      ]
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST}
    ports:
      - "127.0.0.1:${ORIGIN_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/blog.conf.template:ro
    networks: [backend]
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    shm_size: 128mb
    logging: *logging

  meilisearch:
    image: ${MEILI_IMAGE:-getmeili/meilisearch:v1.53.2}
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 512MiB
      MEILI_MAX_INDEXING_THREADS: "2"
    volumes: [meili_data:/meili_data]
    networks: [backend]
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  ops:
    image: ${BLOG_IMAGE:?Set BLOG_IMAGE}:${BLOG_RELEASE:?Set BLOG_RELEASE}-ops
    profiles: [tools]
    init: true
    environment: *app-environment
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

networks:
  backend:

volumes:
  postgres_data:
  meili_data:
