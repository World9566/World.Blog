name: Check and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create isolated test configuration
        shell: bash
        run: |
          umask 077
          printf 'POSTGRES_PASSWORD=%s\nMEILI_MASTER_KEY=%s\nBETTER_AUTH_SECRET=%s\nBETTER_AUTH_URL=http://localhost:3000\nGITHUB_CLIENT_ID=ci-test\nGITHUB_CLIENT_SECRET=ci-test\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
      - name: Check shell syntax and start test services
        run: |
          for file in scripts/ops/*.sh; do bash -n "$file"; done
          docker compose up -d --build --wait --wait-timeout 300
      - name: Verify application
        run: |
          docker compose exec -T web pnpm test
          docker compose exec -T web pnpm typecheck
          docker compose exec -T web pnpm content:check
          docker compose exec -T web pnpm auth:check
          docker compose exec -T web pnpm community:check
          docker compose exec -T web pnpm admin:check
          docker compose exec -T web node --test tests/production-env.test.mjs
      - name: Verify production deployment and recovery
        run: bash scripts/check-production.sh
      - name: Clean up test services
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish infrastructure images to the same registry
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          for entry in 'postgres:18.6-bookworm postgres-18.6-bookworm' 'nginx:1.28.2-alpine nginx-1.28.2-alpine' 'getmeili/meilisearch:v1.53.2 meilisearch-1.53.2'; do
            read -r source tag <<< "$entry"
            docker pull "$source"
            docker tag "$source" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
      - name: Publish application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish maintenance image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ops
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}-ops
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            REVISION=${{ github.sha }}
          cache-from: type=gha

  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Deploy the checked commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          umask 077
          key="$RUNNER_TEMP/blog-key"
          hosts="$RUNNER_TEMP/blog-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          # The archive has no .git, ignored credentials, backups or build output.
          # The destination is a dedicated directory in the deployment user's home.
          git archive "$GITHUB_SHA" | ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; mkdir -p ~/apps/world-blog; cd ~/apps/world-blog; tar -xf -; bash scripts/ops/deploy.sh '$GITHUB_SHA'"
